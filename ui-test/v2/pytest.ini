# v2 pytest 配置
[pytest]
# 测试发现
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认选项
addopts = -v --tb=short --strict-markers

# 把 ui-test/ 本身加进 sys.path,让 `from v2.xxx import ...` 能解析
pythonpath = ..

# 测试根目录
testpaths = case

# Markers
markers =
    smoke: 冒烟测试 — 关键路径的快速验证
    ui: 需要浏览器的测试 (默认就都跑)
    no_browser: 不需要浏览器的 demo/配置测试
