# pytest configuration for python-ui-auto-test
#
# 2026-06 新增 — 让项目能直接用 pytest 跑，不动现有 unittest 风格的 case。
# 跑法：
#   cd ui-test
#   pip install -r requirements.txt
#   pytest                                    # 跑全部
#   pytest case/test_baidu_case.py -v         # 跑单个文件
#   pytest -k baidu                           # 跑名字含 baidu 的
#   pytest --html=report/html/pytest.html ... # 用 pytest-html 出报告

[pytest]
# 测试发现规则（覆盖 unittest 默认）
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 默认选项
addopts =
    -v
    --tb=short
    --strict-markers
    --showlocals
    -ra

# 把 ui-test/ 本身加进 sys.path，让 case/*.py 里的
# `from base.xxx import ...` / `from page.xxx import ...` 能正常解析
# （unittest runner 通过 run_all.py 同目录执行来 work，pytest 需要显式声明）
pythonpath = .

# 测试根目录
testpaths = case

# Markers（pytest 的标签系统）
markers =
    smoke: 冒烟测试 — 关键路径的快速验证
    regression: 回归测试
    slow: 慢测试（>10s）
    remote: 需要远程 Selenium Grid 的测试
    skip_redis: 跳过依赖 redis 的测试
    skip_mysql: 跳过依赖 mysql 的测试

# 输出 — 简化 traceback（BeautifulReport/selenium 的内部错误不显示）
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
